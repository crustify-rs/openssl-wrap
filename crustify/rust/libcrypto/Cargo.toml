[package]
name = "libcrypto"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
deprecated-1-1-0 = []
deprecated-3-0 = []
deprecated-3-5 = []

[dependencies]
ffibox.workspace = true
libc = { path = "../libc" }
libcrypto-sys = { path = "../libcrypto-sys" }

# Tests for the `FILE *` wrappers need a real stream; the `libc` crate models a
# stream as a borrowed handle only, because C owns every stream this tree sees.
[dev-dependencies]
libc-sys = { path = "../libc-sys" }

[lints]
workspace = true
